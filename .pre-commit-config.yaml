repos:
-   repo: https://github.com/snakemake/snakefmt
    rev: v0.11.4
    hooks:
    -   id: snakefmt
-   repo: local
    hooks:
    -   id: snakemake-lint
        name: Snakemake Lint
        # Use the pixi task for encapsulated execution
        entry: pixi run lint
        language: system
        pass_filenames: false
        always_run: true
