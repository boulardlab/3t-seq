$schema: "http://json-schema.org/draft-04/schema#"
description: "Configuration schema for the 3t-seq pipeline"
type: object
properties:
  globals:
    type: object
    description: "Global settings affecting the pipeline paths."
    properties:
      results_folder:
        type: string
        description: "Path to the main results folder where all pipeline outputs will be saved."
    required:
      - results_folder
    additionalProperties: false
    errorMessage: "Invalid globals configuration. Paths like qc_folder, log_folder, references_folder, tmp_folder, and analysis_folder are now automatically derived from results_folder and should be removed from the config file."
  defaults:
    type: object
    default: {}
    description: "Global default parameters for all sequencing libraries."
    properties:
      strandedness:
        type: integer
        enum: [0, 1, 2]
        default: 0
        description: "Library strandedness (0: unstranded, 1: stranded, 2: reversely stranded)."
      starTE_random:
        type: object
        default: {}
        properties:
          outFilterMultimapNmax:
            type: integer
            default: 5000
          winAnchorMultimapNmax:
            type: integer
            default: 5000
          alignTranscriptsPerWindowNmax:
            type: integer
            default: 300
      starTE_multihit:
        type: object
        default: {}
        properties:
          outFilterMultimapNmax:
            type: integer
            default: 1
          winAnchorMultimapNmax:
            type: integer
            default: 5000
          alignTranscriptsPerWindowNmax:
            type: integer
            default: 3000
      deseq2:
        type: object
        default: {}
        description: "Default DESeq2 parameters."
        properties:
          test:
            type: string
            enum: ["Wald", "LRT"]
            default: "Wald"
          variable:
            type: string
            default: "genotype"
          reference_level:
            type: string
        additionalProperties: false
  sequencing_libraries:
    type: array
    description: "List of sequencing libraries to process."
    items:
      type: object
      properties:
        name:
          type: string
          description: "Name of the sequencing library."
        sample_sheet:
          type: string
          description: "Path to the sample sheet CSV file."
        trimmomatic:
          oneOf:
            - type: string
            - type: object
              properties:
                adaptive:
                  type: boolean
                  default: false
                extra_params:
                  type: string
              additionalProperties: false
          description: "Optional custom Trimmomatic parameters (fixed string or adaptive object)."
        star:
          type: string
          description: "Optional custom STAR aligner parameters for single-copy genes."
        starTE_random:
          type: object
          description: "Optional override for starTE random mode."
        starTE_multihit:
          type: object
          description: "Optional override for starTE multihit mode."
        strandedness:
          type: integer
          enum: [0, 1, 2]
          description: "Library override for strandedness."
        bamCoverage:
          type: string
          description: "Optional custom bamCoverage parameters."
        deseq2:
          type: object
          description: "Optional library-level DESeq2 overrides."
          properties:
            test:
              type: string
              enum: ["Wald", "LRT"]
            variable:
              type: string
            reference_level:
              type: string
          additionalProperties: false
      required:
        - name
        - sample_sheet
  genome:
    type: object
    description: "Genome references."
    properties:
      label:
        type: string
        enum: ["mm10", "mm39"]
        description: "Genome label. Required."
      fasta_path:
        type: string
        description: "Local path to explicit genome fasta."
      gtf_path:
        type: string
        description: "Local path to explicit genome GTF annotation."
      annotation_type:
        type: string
        enum: ["mgi", "gencode", "ensembl"]
        default: "ensembl"
        description: "Type of genome annotation. Required if custom fasta/gtf are provided."
      selected_chromosomes:
        type: ["array", "null"]
        items:
          type: string
        default: null
        description: "List of chromosomes to process. If not provided, all chromosomes will be processed."
    required:
      - label
    dependencies:
      fasta_path: ["gtf_path", "annotation_type"]
      gtf_path: ["fasta_path", "annotation_type"]
    errorMessage: "You must provide a 'label' (e.g. mm10, mm39). If you provide 'fasta_path' or 'gtf_path', you must provide both plus 'annotation_type' to override the default references."
  disable_TE_analysis:
    type: boolean
    default: false
    description: "Disable TE analysis."
  disable_salmonTE_analysis:
    type: boolean
    default: false
    description: "Disable SalmonTE analysis."
  disable_tRNA_analysis:
    type: boolean
    default: false
    description: "Disable tRNA analysis."
  tRNA_quantification:
    type: object
    properties:
      method:
        type: string
        enum: ["standard", "mim-tRNA-seq"]
        default: "standard"
        description: "Method for tRNA quantification."
      mimseq_params:
        type: object
        properties:
          max_mismatches:
            type: number
            default: 2
            description: "Maximum number of mismatches allowed."
          cluster_identity:
            type: number
            default: 0.8
            description: "Cluster identity threshold."
          min_cov:
            type: integer
            default: 10
            description: "Minimum coverage required for a tRNA to be quantified."
    required:
      - method
required:
  - globals
  - sequencing_libraries
  - genome
