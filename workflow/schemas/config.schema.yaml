$schema: "http://json-schema.org/draft-04/schema#"
description: "Configuration schema for the 3t-seq pipeline"
type: object
properties:
  globals:
    type: object
    description: "Global settings affecting the pipeline paths."
    properties:
      results_folder:
        type: string
        description: "Path to the main results folder where all pipeline outputs will be saved."
    required:
      - results_folder
    additionalProperties: false
    errorMessage: "Invalid globals configuration. Paths like qc_folder, log_folder, references_folder, tmp_folder, and analysis_folder are now automatically derived from results_folder and should be removed from the config file."
  defaults:
    type: object
    description: "Global default parameters for all sequencing libraries."
    properties:
      strandedness:
        type: integer
        enum: [0, 1, 2]
        description: "Library strandedness (0: unstranded, 1: stranded, 2: reversely stranded)."
      starTE_random:
        type: object
        properties:
          outFilterMultimapNmax:
            type: integer
          winAnchorMultimapNmax:
            type: integer
          alignTranscriptsPerWindowNmax:
            type: integer
      starTE_multihit:
        type: object
        properties:
          outFilterMultimapNmax:
            type: integer
          winAnchorMultimapNmax:
            type: integer
          alignTranscriptsPerWindowNmax:
            type: integer
  sequencing_libraries:
    type: array
    description: "List of sequencing libraries to process."
    items:
      type: object
      properties:
        name:
          type: string
          description: "Name of the sequencing library."
        sample_sheet:
          type: string
          description: "Path to the sample sheet CSV file."
        trimmomatic:
          type: string
          description: "Optional custom Trimmomatic parameters."
        star:
          type: string
          description: "Optional custom STAR aligner parameters for single-copy genes."
        starTE_random:
          type: object
          description: "Optional override for starTE random mode."
        starTE_multihit:
          type: object
          description: "Optional override for starTE multihit mode."
        strandedness:
          type: integer
          enum: [0, 1, 2]
          description: "Library override for strandedness."
        bamCoverage:
          type: string
          description: "Optional custom bamCoverage parameters."
      required:
        - name
        - sample_sheet
  genome:
    type: object
    description: "Genome references."
    properties:
      label:
        type: string
        description: "Standard genome label (e.g. mm10, hg38) to automatically fetch references."
      salmonte_species:
        type: string
        description: "Fallback species identifier for SalmonTE (e.g. mm, hs, dr, dm) when using custom references without a top-level label."
      fasta_path:
        type: string
        description: "Local path to explicit genome fasta."
      gtf_path:
        type: string
        description: "Local path to explicit genome GTF annotation."
      gtrnadb_url:
        type: string
        description: "URL or path to GtRNAdb annotations."
      annotation_type:
        type: string
      selected_chromosomes:
        type: array
        items:
          type: string
    anyOf:
      - required: [label]
      - required: [fasta_path, gtf_path, annotation_type]
    errorMessage: "You must provide either 'label' (for built-in genomes) OR both 'fasta_path' and 'gtf_path' with 'annotation_type' (for custom genomes)."
  disable_TE_analysis:
    type: boolean
  disable_salmonTE_analysis:
    type: boolean
  disable_tRNA_analysis:
    type: boolean
  tRNA_quantification:
    type: object
    properties:
      method:
        type: string
        enum: ["standard", "mim-tRNA-seq"]
      mimseq_params:
        type: object
        properties:
          max_mismatches:
            type: number
          cluster_identity:
            type: number
          min_cov:
            type: integer
required:
  - globals
  - sequencing_libraries
  - genome
