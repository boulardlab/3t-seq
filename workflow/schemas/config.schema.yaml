$schema: "http://json-schema.org/draft-04/schema#"
description: "Configuration schema for the 3t-seq pipeline"
type: object
properties:
  globals:
    type: object
    description: "Global settings affecting the pipeline paths."
    properties:
      results_folder:
        type: string
        description: "Path to the main results folder where all pipeline outputs will be saved."
      reads_folder:
        type: string
        description: "Path to the folder containing raw reads structure"
    required:
      - results_folder
    additionalProperties: false
    errorMessage: "Invalid globals configuration. Paths like qc_folder, log_folder, references_folder, tmp_folder, and analysis_folder are now automatically derived from results_folder and should be removed from the config file."
  sequencing_libraries:
    type: array
    description: "List of sequencing libraries to process."
    items:
      type: object
      properties:
        name:
          type: string
          description: "Name of the sequencing library."
        sample_sheet:
          type: string
          description: "Path to the sample sheet CSV file."
        trimmomatic:
          type: string
          description: "Optional custom Trimmomatic parameters."
        star:
          type: string
          description: "Optional custom STAR aligner parameters."
        bamCoverage:
          type: string
          description: "Optional custom bamCoverage parameters."
      required:
        - name
        - sample_sheet
  genome:
    type: object
    description: "Genome references."
    properties:
      label:
        type: string
        description: "Standard genome label (e.g. mm10, hg38) to automatically fetch references."
      fasta_path:
        type: string
        description: "Local path to explicit genome fasta."
      gtf_path:
        type: string
        description: "Local path to explicit genome GTF annotation."
      gtrnadb_url:
        type: string
        description: "URL or path to GtRNAdb annotations."
      annotation_type:
        type: string
      selected_chromosomes:
        type: array
        items:
          type: string
    oneOf:
      - required: [label]
        not:
          anyOf:
            - required: [fasta_path]
            - required: [gtf_path]
      - required: [fasta_path, gtf_path]
        not:
          required: [label]
    errorMessage: "You must provide either 'label' (for built-in genomes) OR both 'fasta_path' and 'gtf_path' (for custom genomes), but not a mix."
required:
  - globals
  - sequencing_libraries
  - genome
