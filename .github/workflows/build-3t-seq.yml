name: Build 3t-seq

on:
  push:
    branches: [main, dev]
    # Released images are built from the release-please PR; a tag push only
    # builds :X.Y.Z if it is missing, otherwise it no-ops.
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-3t-seq.yml'
  # Builds :X.Y.Z (version from .release-please-manifest.json at the PR head)
  # before the release PR is merged. Only release-please PRs, see job `if`.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Push this X.Y.Z tag (bootstrap); refused if git tag vX.Y.Z exists and the image does too'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/boulardlab/3t-seq

jobs:
  docker:
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.head_ref, 'release-please--') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # type=sha tags the PR head commit, not the merge commit
      DOCKER_METADATA_PR_HEAD_SHA: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) version=$(jq -r '."."' .release-please-manifest.json) ;;
            workflow_dispatch) version="$INPUT_VERSION" ;;
            push) [[ "$GITHUB_REF_TYPE" == tag ]] && version="${GITHUB_REF_NAME#v}" || version="" ;;
          esac
          build=true
          if [[ -n "$version" ]]; then
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::invalid version '$version'"; exit 1
            fi
            tagged=false; exists=false
            git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null && tagged=true
            docker manifest inspect "$IMAGE:$version" > /dev/null 2>&1 && exists=true
            if [[ "$tagged" == true && "$exists" == true ]]; then
              if [[ "$GITHUB_EVENT_NAME" == push ]]; then
                echo "$IMAGE:$version already exists for released v$version; nothing to do."
                build=false
              else
                echo "::error::v$version is released and $IMAGE:$version exists; refusing to overwrite."
                exit 1
              fi
            elif [[ "$tagged" == true && "$GITHUB_EVENT_NAME" == pull_request ]]; then
              echo "::error::v$version is already tagged; the release PR should propose a new version."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.version.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        if: steps.version.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=branch,suffix=-{{sha}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        if: steps.version.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
