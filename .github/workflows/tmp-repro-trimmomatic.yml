# TEMPORARY (#39): reproduce the trimmomatic hang on the GitHub runner.
# Remove before merging.
name: tmp-repro-trimmomatic

on:
  push:
    branches: [fix/39-40-e2e-test]

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: tmp-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.66.0
          cache: true
          environments: dev

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Host info
        run: |
          nproc; free -m; df -h . /tmp; ulimit -a
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true

      - name: Run until trimmomatic_shared_pe (with watchdog)
        timeout-minutes: 30
        run: |
          set -u
          ROOT=$(realpath .)
          mkdir -p diag
          pixi run -e dev test adaptive-trim laptop -- \
            --singularity-args="--bind $ROOT --bind $HOME" \
            --until trimmomatic_shared_pe \
            --printshellcmds --show-failed-logs > diag/snakemake.out 2>&1 &
          SMK=$!
          tail -F diag/snakemake.out &
          TAIL=$!
          # Trimmomatic takes seconds natively on this data: anything over
          # 5 min in the JVM is the hang.
          hung=0
          while kill -0 "$SMK" 2>/dev/null; do
            sleep 30
            jpid=$(pgrep -f 'trimmomatic.*\.jar' | head -1 || true)
            if [[ -n "$jpid" ]]; then
              et=$(ps -o etimes= -p "$jpid" | tr -d ' ' || echo 0)
              echo "::notice::java pid=$jpid elapsed=${et}s"
              if (( et > 300 )); then hung=1; break; fi
            fi
          done
          if (( hung )); then
            echo "::error::trimmomatic JVM running > 5 min, collecting diagnostics"
            {
              echo "== free -m"; free -m
              echo "== ps auxf"; ps auxf
              echo "== java /proc status"; cat /proc/$jpid/status
              echo "== java wchan"; cat /proc/$jpid/wchan; echo
              echo "== java fds"; ls -l /proc/$jpid/fd
              echo "== java cmdline"; tr '\0' ' ' < /proc/$jpid/cmdline; echo
              echo "== java environ (filtered)"; tr '\0' '\n' < /proc/$jpid/environ | grep -E 'JAVA|CONDA|TMP|HOME' || true
              echo "== per-thread state"
              for t in /proc/$jpid/task/*; do echo "$(basename $t) $(cat $t/comm) $(awk '{print $3}' $t/stat) $(cat $t/wchan)"; done
            } > diag/hang.txt 2>&1
            # Thread dump goes to the JVM's stdout, i.e. through tee into the rule log.
            kill -3 "$jpid" || true
            sleep 10
            for d in $(ls -d .tests/integration/.snakemake/singularity 2>/dev/null); do ls -la "$d" >> diag/hang.txt; done
            if command -v jstack >/dev/null; then jstack "$jpid" > diag/jstack.txt 2>&1 || true; fi
            cat diag/hang.txt
            kill "$SMK" || true
            sleep 15
            kill $TAIL || true
            exit 1
          fi
          wait "$SMK"; rc=$?
          kill $TAIL || true
          exit $rc

      - name: Collect rule logs
        if: always()
        run: |
          find .tests/integration/results -path '*trim*' -name '*.txt' -o -path '*trim*' -name '*.json' -o -name '*.log' 2>/dev/null \
            | head -200 | tee diag/files.txt
          for f in $(find .tests/integration/results -path '*_shared*' \( -name '*stats.txt' -o -name '*summary.txt' -o -name '*.json' \) 2>/dev/null); do
            echo "===== $f"; tail -n 200 "$f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trimmomatic-repro
          path: |
            diag/
            .tests/integration/.snakemake/log/
            .tests/integration/results/log/
            .tests/integration/results/**/_shared/**/*.txt
            .tests/integration/results/**/_shared/**/*.json
          if-no-files-found: warn
