# TEMPORARY (#39): reproduce the trimmomatic hang on the GitHub runner.
# Remove before merging.
name: tmp-repro-trimmomatic

on:
  push:
    branches: [fix/39-40-e2e-test]

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: tmp-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMG: docker://ghcr.io/boulardlab/3t-seq:env-2a4c9ee664ce41a562c0007df6c2c4782f10edc9f14fb7c10de48cf954e15448
      ENV: /conda-envs/50e30cdbbcff8910a88966012cee653e
      JAR: /conda-envs/50e30cdbbcff8910a88966012cee653e/share/trimmomatic-0.40-0/trimmomatic.jar
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.66.0
          cache: true
          environments: dev

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Pull image
        run: |
          pixi run -e dev apptainer --version
          pixi run -e dev squashfuse_ll --version 2>&1 | head -3 || true
          time pixi run -e dev apptainer pull --disable-cache img.sif "$IMG"

      - name: Experiments
        run: |
          set +e
          mkdir -p diag out
          R1=.tests/integration/GSE130735-subset/SRX5795117_SRR9016963_1.fq.gz
          R2=.tests/integration/GSE130735-subset/SRX5795117_SRR9016963_2.fq.gz
          TRIM="trimmomatic PE -threads 2 $R1 $R2 out/p1.fq.gz out/u1.fq.gz out/p2.fq.gz out/u2.fq.gz LEADING:3 TRAILING:3"
          dump() {
            for p in $(pgrep -f 'java|squashfuse' || true); do
              echo "-- pid $p $(tr '\0' ' ' < /proc/$p/cmdline | cut -c1-150)"
              for t in /proc/$p/task/*; do echo "   $(basename $t) $(cat $t/comm) $(cat $t/wchan)"; done
            done
          }
          run() {  # name, cmd...
            local name=$1; shift
            echo "::group::$name"
            local t0=$(date +%s)
            timeout -k 5 150 "$@" > "diag/$name.log" 2>&1 &
            local pid=$!
            sleep 100 &
            local s=$!
            while kill -0 $pid 2>/dev/null && kill -0 $s 2>/dev/null; do sleep 2; done
            if kill -0 $pid 2>/dev/null; then echo "still running at 100s:"; dump | tee "diag/$name.hang.txt"; fi
            wait $pid; local rc=$?
            kill $s 2>/dev/null || true
            tail -n 15 "diag/$name.log"
            echo "RESULT $name rc=$rc t=$(( $(date +%s) - t0 ))s" | tee -a diag/results.txt
            echo "::endgroup::"
            pkill -9 -f squashfuse_ll || true
          }
          A="pixi run -e dev apptainer"
          IN=". /opt/conda/bin/activate $ENV;"
          run e1_shell        $A exec img.sif bash -c "ls -la $JAR && echo ok"
          run e2_java_version $A exec img.sif bash -c "$IN java -version"
          run e3_trim_version $A exec img.sif bash -c "$IN trimmomatic -version"
          run e4_trim_run     $A exec img.sif bash -c "$IN $TRIM"
          run e5_trim_run_rep $A exec img.sif bash -c "$IN $TRIM"
          run e6_cat_jar      $A exec img.sif bash -c "cat $JAR | wc -c; cat $ENV/lib/jvm/lib/modules | wc -c"
          run e7_unsquash     $A exec --unsquash img.sif bash -c "$IN $TRIM"
          # Manual squashfuse_ll mounts, multi-threaded vs single-threaded (-s).
          OFF=$(pixi run -e dev apptainer sif list img.sif | awk '/Squashfs|FS/ {print}' | head -3)
          echo "$OFF"
          OFFSET=$(pixi run -e dev python - <<'EOF'
          import subprocess,re
          out=subprocess.run(["apptainer","sif","list","img.sif"],capture_output=True,text=True).stdout
          for l in out.splitlines():
              if "FS" in l and "Squashfs" in l:
                  print(re.split(r"\s*\|\s*", l.strip())[3].split("-")[0]); break
          EOF
          )
          echo "offset=$OFFSET"
          mkdir -p mnt_mt mnt_st
          run e8_fuse_mt sh -c "pixi run -e dev squashfuse_ll -f -o ro,offset=$OFFSET img.sif mnt_mt & sleep 3; stat mnt_mt$JAR && cat mnt_mt$JAR | wc -c && cat mnt_mt$ENV/lib/jvm/lib/modules | wc -c; fusermount3 -u mnt_mt || fusermount -u mnt_mt"
          run e9_fuse_st sh -c "pixi run -e dev squashfuse_ll -f -s -o ro,offset=$OFFSET img.sif mnt_st & sleep 3; stat mnt_st$JAR && cat mnt_st$JAR | wc -c && cat mnt_st$ENV/lib/jvm/lib/modules | wc -c; fusermount3 -u mnt_st || fusermount -u mnt_st"
          # System apptainer (setuid, kernel squashfs mount: no FUSE).
          sudo add-apt-repository -y ppa:apptainer/ppa > /dev/null 2>&1 && sudo apt-get install -y -q apptainer-suid > /dev/null 2>&1 && /usr/bin/apptainer --version
          run e10_suid_trim /usr/bin/apptainer exec img.sif bash -c "$IN $TRIM"
          # Same system install, forced unprivileged: uses its own squashfuse_ll.
          ls -la /usr/libexec/apptainer/bin/ || true
          run e11_ppa_userns_trim /usr/bin/apptainer exec --userns img.sif bash -c "$IN $TRIM"
          # pixi apptainer, with the PPA squashfuse_ll first on PATH.
          run e12_pixi_ppa_squashfuse env PATH="/usr/libexec/apptainer/bin:$PWD/.pixi/envs/dev/bin:$PATH" .pixi/envs/dev/bin/apptainer exec img.sif bash -c "$IN $TRIM"
          run e13_pixi_ppa_squashfuse_rep env PATH="/usr/libexec/apptainer/bin:$PWD/.pixi/envs/dev/bin:$PATH" .pixi/envs/dev/bin/apptainer exec img.sif bash -c "$IN $TRIM"
          echo; cat diag/results.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trimmomatic-experiments
          path: diag/
