site_name: 3t-seq Manual
site_description: Documentation for the 3t-seq pipeline
repo_url: https://github.com/boulardlab/3t-seq
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - admonition
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
plugins:
  - search
  - git-revision-date-localized
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
      draggable: true
      auto_caption: false
extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Getting Started: getting-started/index.md
  - Tutorial:
      - 1. Quickstart: tutorial/quickstart.md
      - 2. Preparing Data & Samples: tutorial/setup.md
      - 3. Advanced Profiles: tutorial/profiles.md
      - 4. Running & Reporting: tutorial/running.md
      - 5. YAML Syntax Primer: tutorial/yaml-syntax.md
  - Configuration: configuration/index.md
  - Usage: usage/index.md
  - Analysis Modules:
      - Reference Management: modules/references.md
      - Preprocessing: modules/preprocessing.md
      - Alignment: modules/alignment.md
      - TE Analysis: modules/te-analysis.md
      - tRNA Analysis: modules/trna-analysis.md
      - Quantification & DE: modules/quantification-de.md
  - Algorithms:
      - Deduplication: algorithms/deduplication.md
      - Adaptive Trimming: algorithms/adaptive-trimming.md
