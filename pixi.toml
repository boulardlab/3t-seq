[workspace]
name = "3t-seq"
version = "2.0.0"
description = "3t-seq: a Snakemake pipeline for total RNA-seq analysis"
authors = ["Francesco Tabaro"]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
snakemake = "==8.9.0"
snakefmt = ">=0.11.4"
pre-commit = ">=4.5.1"
pandas = "*"
pyyaml = "*"
mamba = "*"
conda = "*"
pytest = ">=8.1.1"
mkdocs = "<2"
mkdocs-material = "*"
mkdocstrings-python = "*"
mkdocs-glightbox = "*"
mkdocs-git-revision-date-localized-plugin = "*"

[target.linux-64.dependencies]
apptainer = ">=1.2.5"

[target.osx-arm64.activation]
scripts = ["scripts/macos-coreutils-setup.sh"]
env = { PATH = "$PIXI_PROJECT_ROOT/.pixi/macos-shims:$PATH" }

[tasks]
format = "snakefmt workflow"
hooks = "pre-commit run --all-files"
docs-serve = { cmd = "mkdocs serve", env = { NO_MKDOCS_2_WARNING = "1" } }
docs-build = { cmd = "mkdocs build", env = { NO_MKDOCS_2_WARNING = "1" } }

################################################################################
# Linting
################################################################################

[tasks.lint]
cmd = [
    "snakemake",
    "--directory", ".tests/integration",
    "--conda-frontend", "conda",
    "--workflow-profile", ".tests/integration/profiles/{{ profile }}",
    "--configfile", ".tests/integration/configs/{{ config }}.yaml",
    "--snakefile", "workflow/Snakefile",
    "--lint",
]

[[tasks.lint.args]]
arg = "config"
default = "remote-references"
choices = ["remote-references", "local-references", "adaptive-trim"]

[[tasks.lint.args]]
arg = "profile"
default = "laptop"
choices = ["laptop", "hpc"]

################################################################################
# Containerize
################################################################################

[tasks.containerize]
cmd = [
    "snakemake",
    "--quiet", "all",
    "--directory", ".tests/integration",
    "--configfile", ".tests/integration/configs/remote-references.yaml",
    "--profile", ".tests/integration/profiles/laptop",
    "--snakefile", "workflow/Snakefile",
    "--containerize", 
    "|", 
    "tail", 
    "-n", 
    "+2", 
    ">", 
    "Dockerfile"
]

################################################################################
# Build conda envs
################################################################################

[tasks.build-conda-envs]
cmd = [
    "snakemake",
    "--directory", ".tests/integration",
    "--configfile", ".tests/integration/configs/remote-references.yaml",
    "--snakefile", "workflow/Snakefile",
    "--conda-create-envs-only",
    "--use-conda",
    "--conda-frontend", "conda",
]

################################################################################
# Dry-run
################################################################################

[tasks.dry-run]
cmd = [
    "snakemake",
    "--directory", ".tests/integration",
    "--conda-frontend", "conda",
    "--workflow-profile", ".tests/integration/profiles/{{ profile }}",
    "--configfile", ".tests/integration/configs/{{ config }}.yaml",
    "--snakefile", "workflow/Snakefile",
    "-n",
]

[[tasks.dry-run.args]]
arg = "config"
default = "remote-references"
choices = ["remote-references", "local-references", "adaptive-trim"]

[[tasks.dry-run.args]]
arg = "profile"
default = "laptop"
choices = ["laptop", "hpc"]

################################################################################
# Test
################################################################################

[tasks.test]
cmd = [
    "snakemake",
    "--directory", ".tests/integration",
    "--conda-frontend", "conda",
    "--workflow-profile", ".tests/integration/profiles/{{ profile }}",
    "--configfile", ".tests/integration/configs/{{ config }}.yaml",
    "--snakefile", "workflow/Snakefile",
]

[[tasks.test.args]]
arg = "config"
default = "remote-references"
choices = ["remote-references", "local-references", "adaptive-trim"]

[[tasks.test.args]]
arg = "profile"
default = "laptop"
choices = ["laptop", "hpc"]

################################################################################
# Test report
################################################################################

[tasks.test-report]
cmd = [
    "snakemake",
    "--directory", ".tests/integration",
    "--conda-frontend", "conda",
    "--workflow-profile", ".tests/integration/profiles/{{ profile }}",
    "--configfile", ".tests/integration/configs/{{ config }}.yaml",
    "--snakefile", "workflow/Snakefile",
    "--report", "report.zip",
]

[[tasks.test-report.args]]
arg = "config"
default = "remote-references"
choices = ["remote-references", "local-references", "adaptive-trim"]

[[tasks.test-report.args]]
arg = "profile"
default = "laptop"
choices = ["laptop", "hpc"]