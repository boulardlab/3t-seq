globals:
  results_folder: /scratch/zeloni/prj/github_3tseq_fork/dataset/phase1/3t-seq/results_notrim

genome:
  label: mm10

comparisons:
  - name: Morula_vs_4C
    protocol: pe
    sample_sheet: metadata_morula_4C.csv
    deseq2:
      test: Wald
      variable: Stage
      reference_level: 4C
  - name: Blastocyst_vs_Morula
    protocol: pe
    sample_sheet: metadata_blasto_morula.csv
    deseq2:
      test: Wald
      variable: Stage
      reference_level: Morula
  - name: 2C_vs_Zygote
    protocol: pe
    sample_sheet: metadata_2C_zygote.csv
    deseq2:
      test: Wald
      variable: Stage
      reference_level: Zygote
  - name: 4C_vs_2C
    protocol: pe
    sample_sheet: metadata_4C_2C.csv
    deseq2:
      test: Wald
      variable: Stage
      reference_level: 2C

disable_TE_analysis: false
disable_salmonTE_analysis: false
disable_tRNA_analysis: true
disable_trimming: true
